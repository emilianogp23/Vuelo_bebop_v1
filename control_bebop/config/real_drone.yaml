/**:
  ros__parameters:
    use_real_drone: true

    # ── Geocerca / bridge ─────────────────────────────────────
    # Actúa en el aire (de takeoff a land) en TODOS los estados, manual incluido,
    # también sobre los ceros del hover, en el vuelo real (real_drone_bridge), en
    # simulación (sim_odometry) y en el modo muestra. Cuadrado ±arena_x_max
    # alrededor del origen. Hacia afuera solo deja ir a (distancia a 1.7 m) /
    # geofence_lookahead m/s y frena si va más rápido; pasando 1.7 m empuja hacia
    # dentro. Elegido con los modelos identificados de los bags de octubre: con el
    # piloto empujando hacia la valla, el peor caso se detiene en ~2.02 m (valla a
    # ~2.45). La órbita de r 0.5 en (1, 0) pasa sin frenarse. Sin validar en vuelo.
    geofence_enabled: true
    arena_x_max: 2.0          # ≤ distancia del origen a la valla más cercana
    max_z: 2.0
    geofence_lookahead: 2.5   # s
    geofence_brake_gain: 2.0  # comando por m/s de exceso sobre la velocidad permitida
    geofence_push_gain: 0.5   # empuje extra por m pasado del límite duro
    geofence_max_push: 0.4
    # Modo sombra: la geocerca usa la pose corregida por los ArUco si hay lock
    # (la odometría sola no ve la deriva). Con la visión al mando, siempre.
    geofence_use_vision: true
    max_cmd_xy: 0.40
    max_cmd_z: 0.60
    # El Bebop gira ~0.21 rad/s por unidad de comando: con 0.60 el máximo era
    # ~0.126 rad/s y la órbita en lookat pedía 0.12 (sin margen).
    max_cmd_yaw: 1.00
    # La z viene de /bebop/altitude (sonar + barómetro, parche del driver en
    # patches/). Antes era la vz integrada: marcaba hasta +1.07 m ya en el piso.
    # Techo de firmware: parámetro max_altitude del driver (2.0 m por defecto).
    z_geofence_enabled: true
    use_altitude_topic: true
    altitude_timeout: 1.0

    # ── Zona segura y robots en el piso ───────────────────────
    # Origen = centro de la zona segura de despegue. Fuera de este círculo la
    # geocerca no deja bajar de min_z_outside_safe ni alejarse si está más
    # bajo (empuja hacia arriba). Requiere z medida (/bebop/altitude).
    safe_zone_radius: 0.5
    min_z_outside_safe: 1.0

    # ── Corrección visual (odometría + ArUco vistos por el Bebop) ──
    # Ver GUIA_PRUEBAS_Y_LOCALIZACION.md. Marco "corral": origen en la zona segura,
    # x hacia la valla de enfrente al despegar (config/aruco_map.yaml).
    # La posición la da la odometría; cada vez que la cámara del Bebop ve
    # marcadores (/vision/onboard/pose) se corrige su error acumulado.
    # vision_shadow: true = solo publica /vision/fused_pose para comparar; el
    #   control sigue con la odometría. false = el control usa la pose corregida.
    # Lock = incertidumbre de la posición < vision_max_sigma. Crece √(q_xy·t)
    # sin marcadores: de 0.05 a 0.20 m en ~15 s. Sin lock R1 no inicia la
    # órbita y tras vision_loss_hover_time → HOVER (solo con visión al mando).
    use_vision: true
    # 23 oct: en modo sombra la corregida quedó a 0.10 m (mediana) de la posición
    # real y la odometría a 0.75 m → visión al mando desde el vuelo 3.
    vision_shadow: false
    vision_q_xy: 0.0025
    # Incertidumbre por metro que mide la odometría (m²/m). El 23 oct, volando
    # rápido en manual, la odometría erró ~1 m en 3 m y con solo q_xy el filtro
    # rechazaba las mediciones buenas. Reproducido offline contra el video: p90
    # 94 → 46 cm en ese vuelo (con rate_xy 0.25), la órbita lenta igual.
    vision_q_move: 0.02
    vision_q_yaw: 0.0001
    vision_gate_sigma: 3.0         # rechaza mediciones a más de 3σ de lo esperado
    vision_max_sigma: 0.20
    vision_init_sigma_xy: 0.05     # el dron se coloca en el origen mirando a +x
    vision_init_sigma_yaw_deg: 3.0
    vision_offset_rate_xy: 0.25    # m/s: la corrección entra suave, sin escalón (0.10 tardaba 10 s en corregir 1 m)
    vision_offset_rate_yaw_deg: 5.0
    vision_loss_hover_time: 2.0
    # aruco_localizer. Validación en mano del 23 oct (puntos de control, guía
    # §6.5): con dos marcadores error 1–10 cm, con uno solo 30–50 cm y 8–14° a
    # cualquier distancia probada. Con 2 px se descartaban las poses de dos
    # marcadores (error de reproyección 2.6–2.9 px por la medición del mapa).
    min_markers: 2
    max_reproj_px: 4.0
    # 27 oct: con 2 marcadores lejanos PnP a veces da una pose volteada 0.5–1 m
    # (rachas de 3–6 s en el 112122). Un salto > max_meas_jump respecto a la
    # última medición se rechaza salvo 6 seguidas coincidentes; con menos de
    # 3 marcadores la σ declarada se multiplica por sigma_few_factor.
    max_meas_jump: 0.5
    sigma_few_factor: 1.5
    # Tilt de la cámara del Bebop para ver los ArUco de las vallas (también
    # afecta el video del escaneo). NaN = aruco_localizer no mueve la cámara.
    # 27 oct: -28° dejaba fuera de cuadro la cara cercana de la caja (h 1.1 m,
    # r 0.6); -35° con r 0.85 la ve entera y aún ve los marcadores a 4 m
    # (con -40° quedan fuera de cuadro).
    camera_tilt_deg: -30.0
    # Con real_flight.launch.py obj_suelo:=true (objeto en el piso, Pioneer 3DX)
    # la cámara baja a este tilt durante la órbita. Para radio r y altura h:
    # tilt ≈ -atan((h - 0.12) / r); r 0.5 y h 1.5 → -70°.
    camera_tilt_suelo_deg: -70.0

    # ── Ganancias PID (control_PID.py) ────────────────────────
    # Identificado en los bags del 13 y 15 oct: pitch/roll ≈ aceleración,
    # retardo ~0.6–0.8 s, ~1.5–2 m/s por unidad en régimen. Con kp 0.70 /
    # kd 0.15 el dron oscilaba ±0.45 m (periodo ~6 s). Elegidas con un barrido
    # sobre 6 modelos identificados (scripts/analisis_bag.py): sobrepaso de la
    # aproximación 0–0.23 m y error de órbita <=0.10 m en todos.
    kp_xy: 0.25
    # Vuelo del 16 oct: con ki 0.03 e int_limit 0.5 el integral daba como
    # máximo 0.015 y no compensaba la deriva hacia atrás. Ahora hasta 0.10.
    ki_xy: 0.05
    int_limit_xy: 2.0
    kd_xy: 0.60           # D = kd·(v_ref − v_medida) con /odom_local
    use_measured_velocity: true
    kp_z: 0.50
    ki_z: 0.02
    kd_z: 0.10
    kp_yaw: 0.80
    ki_yaw: 0.0
    kd_yaw: 0.12
    max_vel_xy: 0.35
    max_vel_z: 0.40
    max_vel_yaw: 1.00

    # ── Modo de Altitud Z (solución a baja y sube en Z) ──────
    # 'native': En AUTOMATIC mantiene altura con el sonar/barómetro nativo del Bebop (gaz=0),
    # evitando la deriva de integración del driver que causaba que el dron bajara y subiera.
    # 'pid': Lazo cerrado continuo sobre odometría z.
    z_mode: native
    # Con altura real: corrige ±0.2 si se aleja más de 0.40 m de la de entrada.
    # Si el driver no tiene el parche de altura, ponerlo en false (la z deriva).
    native_z_guard: true

    # ── Feedforward de velocidad ──────────────────────────────
    enable_feedforward: true
    # Antes 1.25: suponía comando ∝ velocidad y en la rampa de aproximación el
    # dron aceleraba a 0.4 m/s y se pasaba ~0.5 m. El régimen medido sugiere
    # 0.2–0.6; más alto reduce el error de órbita pero aumenta el sobrepaso.
    ff_gain_xy: 0.20
    ff_gain_yaw: 4.5

    # ── Calibración odometría (se sobreescribe con el calibrado) ─
    scale_x: 1.0
    scale_y: 1.0
    trim_x: 0.0
    trim_y: 0.0

    # ── Trayectoria circular con orientación al centro (lookat) ──
    # 27 oct: la caja (50x40x50 cm) debe quedar centrada en (target_x, target_y):
    # marcar el punto en el piso y medirlo. Radio 0.85 (con 0.60 la cara cercana
    # quedaba fuera de cuadro y la cámara pasaba a <0.5 m de la caja). La órbita llega a
    # x = target_x + radio = 1.5 m, bajo el límite de 1.7 m de la geocerca; el
    # planner lo recorta a (arena_half_size - safety_margin) - |target_x| = 0.95.
    target_x: 0.70       # Centro del círculo (m, marco de despegue)
    target_y: 0.0
    circle_radius: 0.80    # Radio del círculo (m)
    circle_speed: 0.10     # vuelta en ~63 s; deja ~50 % de margen de yaw
    yaw_mode: lookat       # orientar el frente del dron hacia el centro
    lookat_center: true    # enfoca automáticamente (target_x, target_y)
    lookat_x: 0.8
    lookat_y: 0.0
    hold_entry_altitude: true # mantiene la altura en la que despegó sin saltos
    min_entry_altitude: 1.05  # sobre min_z_outside_safe: la órbita sale de la zona segura
    approach_speed: 0.15   # m/s al ir al punto de entrada
    settle_time: 1.5       # s quieto en el punto de entrada antes de orbitar
    omega_ramp_time: 3.0   # s para acelerar ω de 0 al valor final
    start_tolerance: 0.10
    max_yaw_rate: 0.10     # rad/s; el Bebop logra ~0.21 rad/s con comando 1.0
    # Órbita atascada (θ detenido por error > track_err_stop) durante este
    # tiempo → /trajectory_stalled y el flight_manager pasa a HOVER.
    stall_timeout: 3.0
