# Mapa de marcadores ArUco del corral (marco "corral").
#
# Origen: centro de la zona segura de despegue, en el piso. x hacia la valla
# de enfrente al despegar, y a la IZQUIERDA del dron, z arriba. El dron se
# coloca en el origen mirando a +x. Al medir con cinta, y es positiva a la
# izquierda: un marcador a la derecha del dron lleva y negativa.
#
# Paredes: normal_yaw_deg = hacia dónde mira la cara del marcador, hacia el
#          centro del corral: enfrente 180, derecha 90, atrás 0, izquierda −90.
# Piso:    floor_yaw_deg  = hacia dónde apunta el borde superior del marcador.
# size = lado del cuadro negro (m), sin el margen blanco.
# Imprimir con: python3 scripts/generar_marcadores.py
# Guía completa: GUIA_PRUEBAS_Y_LOCALIZACION.md §3
dictionary: DICT_4X4_50

markers:
  # Vallas: 8 tablas de 2.45 m x 0.60 m, un marcador por tabla. Los ids van de
  # izquierda a derecha vistos desde dentro del corral.
  # Enfrente (+x): 0, 1
  - {id: 0, size: 0.18, center: [2.43, 1.20, 0.32], normal_yaw_deg: 180}
  - {id: 1, size: 0.18, center: [2.42, -1.23, 0.32], normal_yaw_deg: 180}
  # Derecha del dron (−y): 2, 3
  - {id: 2, size: 0.18, center: [1.25, -2.51, 0.31], normal_yaw_deg: 90}
  - {id: 3, size: 0.18, center: [-1.22, -2.51, 0.32], normal_yaw_deg: 90}
  # Atrás (−x): 4, 5
  - {id: 4, size: 0.18, center: [-2.52, -1.32, 0.33], normal_yaw_deg: 0}
  - {id: 5, size: 0.18, center: [-2.52, 1.32, 0.33], normal_yaw_deg: 0}
  # Izquierda del dron (+y): 6, 7
  - {id: 6, size: 0.18, center: [-1.23, 2.47, 0.33], normal_yaw_deg: -90}
  - {id: 7, size: 0.18, center: [1.23, 2.47, 0.333], normal_yaw_deg: -90}
  # Piso: alrededor del objeto (Pioneer 3DX en target_x, target_y), a ~0.5 m de su
  # centro en diagonal. Con obj_suelo:=true son los que ve la cámara del Bebop
  # durante la órbita (mirando hacia abajo no ve las vallas). Si se mueve el
  # robot, se mueven y se re-miden. Valores nominales: 30 y 33 van a la izquierda (+y).
  - {id: 30, size: 0.18, center: [1.50, 0.50, 0.0], floor_yaw_deg: 0}
  - {id: 31, size: 0.18, center: [1.50, -0.50, 0.0], floor_yaw_deg: 0}
  - {id: 32, size: 0.18, center: [0.50, -0.50, 0.0], floor_yaw_deg: 0}
  - {id: 33, size: 0.18, center: [0.50, 0.50, 0.0], floor_yaw_deg: 0}
